<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reservations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --accent: rgb(103,28,28);
  --light-bg: #fffbf2;
  --soft-bg: #F6ECD0;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:transparent;
  font-family:"Montserrat", Arial, sans-serif;
  display:flex;
  justify-content:center;
  padding:30px 10px;
}

/* MAIN CARD */
.container{
  background: linear-gradient(to bottom, var(--light-bg), #F5DFA8);
  width: 450px;
  max-width: 95%;
  padding: 30px;
  border-radius: 22px;
  color: var(--accent);
  text-align:center;
}

.container h1{
  margin: 0;
  font-size: 34px;
  font-weight:900;
}

.subtitle{
  font-size:12px;
  margin-top:6px;
  color:rgba(0,0,0,0.5);
}

/* RESERVATION LIST CARD */
.reservation-card{
  margin-top:25px;
  background:#fff;
  border-radius:16px;
  padding:20px;
  text-align:left;
  box-shadow:0 3px 8px rgba(0,0,0,0.12);
}

/* EACH ITEM */
.res-item{
  background: var(--soft-bg);
  border: 2px solid var(--accent);
  padding:14px;
  border-radius:14px;
  margin-bottom:14px;
  box-shadow:0px 3px 6px rgba(0,0,0,0.18);
  display:flex;
  gap:12px;
}

.res-item:last-child{ margin-bottom:0; }

.res-label{
  font-size:11px;
  opacity:0.65;
}

.res-service{
  font-size:17px;
  font-weight:800;
  margin-top:3px;
}

.res-date{
  margin-top:6px;
  font-size:14px;
  color:var(--accent);
}

/* NO DATA */
.no-reservations{
  text-align:center;
  font-size:14px;
  padding-top:30px;
  opacity:0.7;
}

/* CONTROL BUTTONS */
.action-btn{
  margin-top:16px;
  width:100%;
  background:#f6e2b6;
  border:2px solid var(--accent);
  padding:12px;
  font-weight:800;
  border-radius:50px;
  cursor:pointer;
}
.action-btn:hover{
  transform:scale(1.03);
}

.btn-row{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.btn-small{
  flex:1;
  padding:10px;
  border-radius:50px;
  font-weight:700;
  background:#fff4d8;
  border:2px solid var(--accent);
  cursor:pointer;
}
.btn-small:hover{ transform:scale(1.03); }

</style>
</head>

<body>

<div class="container">
  
  <h1>RESERVATIONS</h1>
  <p class="subtitle">YOUR SAVED BOOKINGS</p>

  <!-- Select Buttons -->
  <div class="btn-row">
    <button class="btn-small" onclick="selectAll()">Select All</button>
    <button class="btn-small" onclick="unselectAll()">Unselect All</button>
  </div>

  <div class="reservation-card">
      <div id="reservationList"></div>
  </div>

  <!-- Action Buttons -->
  <button class="action-btn" onclick="confirmSelected()">Confirm Selected Reservation</button>
  <button class="action-btn" onclick="cancelSelected()">Cancel Selected Reservation</button>

  <button class="action-btn" onclick="clearReservations()">Clear All Reservations</button>

</div>

<script>
/* LOAD RESERVATIONS */
function loadReservations(){
  let list = document.getElementById("reservationList");
  let data = JSON.parse(localStorage.getItem("reservations")) || [];

  if(data.length === 0){
    list.innerHTML = `<p class="no-reservations">No reservations yet.</p>`;
    return;
  }

  list.innerHTML = "";

  data.forEach((item, index) => {
    let div = document.createElement("div");
    div.className = "res-item";

    div.innerHTML = `
      <input type="checkbox" class="res-check" data-index="${index}" style="transform:scale(1.3); margin-top:5px;">
      <div>
        <p class="res-label">SERVICE</p>
        <p class="res-service">${item.service}</p>

        <p class="res-label" style="margin-top:10px;">DATE RESERVED</p>
        <p class="res-date">${item.date}</p>
      </div>
    `;

    list.appendChild(div);
  });
}

/* SELECT ALL */
function selectAll(){
  document.querySelectorAll(".res-check").forEach(c => c.checked = true);
}

/* UNSELECT ALL */
function unselectAll(){
  document.querySelectorAll(".res-check").forEach(c => c.checked = false);
}

/* CANCEL SELECTED */
function cancelSelected(){
  let data = JSON.parse(localStorage.getItem("reservations")) || [];
  let checks = document.querySelectorAll(".res-check");

  let remaining = data.filter((item, index) => !checks[index].checked);

  localStorage.setItem("reservations", JSON.stringify(remaining));
  loadReservations();
}

/* CONFIRM SELECTED */
function confirmSelected(){
  let checks = document.querySelectorAll(".res-check");
  let data = JSON.parse(localStorage.getItem("reservations")) || [];

  let selected = data.filter((item, index) => checks[index].checked);

  if(selected.length === 0){
    alert("No reservation selected.");
    return;
  }

  alert("Reservation Confirmed:\n\n" + 
        selected.map(s => `• ${s.service} (${s.date})`).join("\n"));
}

/* CLEAR ALL */
function clearReservations(){
  if(confirm("Clear all reservations?")){
    localStorage.removeItem("reservations");
    loadReservations();
  }
}

loadReservations();
</script>

</body>
</html>
