<!DOCTYPE html>

<title>Debut</title>
<style>
  body {
    background: #F6ECD0;
    text-align: center;
  }

  /* OUR WORKS */
  .subtitle {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-family: Orelega One;
    font-size: 40px;
    font-weight: 600;
    color: #4A1E1E;
  }

  .title {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    font-family: Orelega One;
    font-size: 150px;
    font-weight: 900;
    color: #4A1E1E;
    white-space: nowrap;
  }

  .debut {
    width: 100%;
    overflow: hidden;
    position: absolute;
    display: flex;
    justify-content: center;
    margin-top: 300px;
    background-color: #F6DC9B;
  }

  .debut-content {
    display: flex;
    animation: scroll 12s linear infinite;
  }

  .debut-content img {
    width: 240px;
    margin-right: 70px;
    border-radius: 50px;
  }

  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-25%); }
  }

  /* BOOK NOW BUTTON */
  .book-btn {
    display: inline-block;
    background-color: #F5DFA8;
    padding: 12px 30px;
    border-radius: 50px;
    font-weight: bold;
    font-size: 22px;
    color: #4A1E1E;
    text-decoration: none;
    margin-top: 670px;
    cursor: pointer;
    border: 2px solid #4A1E1E;
  }
  .exit-btn:hover {
    background: #e9cd8c;
    transform: scale(1.05);
  }
  
  /* EXIT BUTTON */
  .exit-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #F5DFA8;
    border: none;
    padding: 12px 18px;
    border-radius: 40px;
    font-size: 18px;
    font-weight: bold;
    color: #4A1E1E;
    cursor: pointer;
    box-shadow: 0px 0px 8px rgba(0,0,0,0.2);
    transition: 0.2s;
    z-index: 1000;
  }

  .exit-btn:hover {
    background: #e9cd8c;
    transform: scale(1.05);
  }
  
  .book-btn:hover {
    background-color: #e5cb90;
  }

  /* POPUP OVERLAY */
  #popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
  }

  /* POPUP BOX */
  #popup-box {
    background: white;
    width: 50%;
    height: 80%;
    border-radius: 20px;
    padding: 0;
    position: relative;
  }

  /* CLOSE BUTTON */
  #close-popup {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 35px;
    cursor: pointer;
    font-weight: bold;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 20px;
  }
</style>

<script>
function openPopup() {
  document.getElementById("popup").style.display = "flex";
  document.getElementById("popup-frame").src = "Booking.html";
}

function closePopup(event) {
  if (event.target.id === "popup" || event.target.id === "close-popup") {
    document.getElementById("popup").style.display = "none";
    document.getElementById("popup-frame").src = "";
  }
}
