<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacts</title>
    <link rel="stylesheet" href="contact.css">

</head>

<body>
    <header>
    <nav class="navbar">
        <div class="logo">
            <a href="hi.html"><img src="LS Logo.png" width="330" height="120" alt="LS Logo"></a></div>

        <ul>
            <li><a href="homepage.html">Home</a></li>
            <li><a href="about_page.html">About</a></li>
            <li><a href="service.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    </header>
<section class="contact-section">
    
    <div class="contact-wrapper">

        <!-- LEFT SIDE CONTACT INFO -->
        <div class="left-info">
            <div class="icons">
                <h1 style="color: black;">CONTACT US</h1>
            </div>
            <div class="icons">
                <img src="facebook.png" alt="Facebook">
                <a class="info-btn" href="#">LifeStudio Lucena</a>
            </div>

            <div class="icons">
                <img src="phonecall.png" alt="Phone Number">
                <div class="info-btn">710-8871</div>
            </div>

            <div class="icons">
                <img src="location.png" alt="Location">
                <div class="info-btn">
                    39 Enriquez St., Brgy. 2,<br>Lucena City, 4301
                </div>
            </div>

        </div>

        <!-- RIGHT SIDE FORM -->
        <div class="right-info">
            <div class="big-circle">
                <img src="LS Logo.png" alt="LifeStudio Logo">
            </div>

            <form class="contact-form">
                <input type="email" placeholder="Email..." required>
                <textarea placeholder="Send us a message..." required></textarea>
                <button type="submit">Submit</button>
            </form>
        </div>

    </div>

</section>
</body>
</html>
