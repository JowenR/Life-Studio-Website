<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Page</title>
    <link rel="stylesheet" href="booking.css">
</head>
<body>

<!-- CONTAINER 1 -->
<div class="container1">
    <br>
    <b class="title">BOOKINGS</b>
    <p class="subtitle">PLEASE FILL IN DETAILS</p>

    <!-- CONTAINER 2 -->
    <div class="container2">
        <b class="services-title">SERVICES</b>
        <p class="services-sub">Select service you will inquire</p>

        <form action="/submit-booking" method="post">
            <label for="services"></label>
            <select id="services" name="services" required class="select-services">
                <option value="option" selected disabled></option>
                <option value="wedding">WEDDING</option>
                <option value="debut">DEBUT</option>
                <option value="graduation">GRADUATION</option>
                <option value="schoolEvents">SCHOOL EVENTS</option>
                <option value="ordination">ORDINATION</option>
                <option value="schoolID">SCHOOL ID</option>
                <option value="IDmaterial">ID MATERIALS</option>
            </select>

            <!-- CONTAINER 3 -->
            <div class="container3">
                <br>
                <p class="date-title">Select date</p>
                <label for="date" class="date-label">Enter date</label>
                <br><br>

                <center>
                    <input type="date" id="date" name="date" required class="date-input">
                </center>

                <br>
                <input type="submit" value="OK" class="ok-btn">
                <input type="button" value="Cancel" class="cancel-btn">
            </div>

            <center>
                <input type="button" value="Submit" class="submit-btn">
            </center>

        </form>
    </div>

</div>

</body>
</html>
