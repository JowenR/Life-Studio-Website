<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Booking Page</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #cfc8c8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "Montserrat", Arial, sans-serif;
    }

    /* OUTER CONTAINER */
    .container1 {
        width: 420px;
        padding: 25px;
        background: linear-gradient(to bottom, #fffbf2, #F5DFA8);
        color: rgb(103, 28, 28);
        border-radius: 25px;
        box-shadow: 0px 3px 10px rgba(0,0,0,0.2);
    }

    .container1 h1 {
        margin: 0;
        font-size: 36px;
        font-weight: 900;
    }

    .subtitle {
        margin-top: 5px;
        font-size: 12px;
        letter-spacing: 1px;
    }

    /* WHITE CONTENT BOX */
    .container2 {
        width: 320px;
        margin: 20px auto;
        padding: 20px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
    }

    .label-title {
        font-weight: 700;
        font-size: 15px;
    }

    .label-sub {
        font-size: 11px;
        margin-top: -5px;
        color: #6e6e6e;
    }

    select {
        width: 100%;
        height: 33px;
        margin-top: 7px;
        padding: 5px;
        border-radius: 5px;
        border: 1.5px solid rgb(103, 28, 28);
        font-size: 12px;
        color: rgb(103, 28, 28);
    }

    /* DATE CONTAINER */
    .container3 {
        width: 100%;
        background: #F6ECD0;
        margin-top: 15px;
        padding: 20px;
        border-radius: 18px;
    }

    .container3 label {
        font-size: 18px;
        font-weight: 600;
    }

    .date-input {
        width: 90%;
        height: 35px;
        margin-top: 10px;
        border-radius: 6px;
        border: 2px solid rgba(103, 28, 28, 0.7);
        background: #fff;
        color: rgb(103, 28, 28);
        padding: 5px;
        font-size: 14px;
    }

    .btn-small {
        font-size: 12px;
        background: none;
        border: none;
        color: rgb(103, 28, 28);
        cursor: pointer;
        margin-top: 10px;
    }

    .container3-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        margin-right: 10px;
    }

    /* SUBMIT BUTTON */
    .submit-btn {
        background: #f6e2b6;
        width: 170px;
        border-radius: 50px;
        padding: 10px;
        font-size: 18px;
        font-weight: bold;
        border: 2px solid rgb(103, 28, 28);
        cursor: pointer;
        margin-top: 10px;
        box-shadow: 0px 3px 5px rgba(0,0,0,0.2);
    }

</style>
</head>

<body>

<div class="container1">
    <h1>BOOKINGS</h1>
    <p class="subtitle">PLEASE FILL IN DETAILS</p>

    <div class="container2">
        
        <p class="label-title">SERVICES</p>
        <p class="label-sub">SELECT SERVICE YOU WILL INQUIRE</p>

        <select required>
            <option selected disabled>-- OR --</option>
            <option value="wedding">WEDDING</option>
            <option value="debut">DEBUT</option>
            <option value="graduation">GRADUATION</option>
            <option value="schoolEvents">SCHOOL EVENTS</option>
            <option value="ordination">ORDINATION</option>
            <option value="schoolID">SCHOOL ID</option>
            <option value="IDmaterial">ID MATERIALS</option>
        </select>

        <div class="container3">
            <p style="font-size:11px;">Select date</p>
            <label>Enter date</label><br>

            <center>
                <input type="date" class="date-input">
            </center>

            <div class="container3-buttons">
                <button class="btn-small">Cancel</button>
                <button class="btn-small">OK</button>
            </div>
        </div>

        <center>
            <button class="submit-btn">Submit</button>
        </center>

    </div>

</div>

</body>
</html>
