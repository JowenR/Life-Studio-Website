<!DOCTYPE html>
<html>
<head>
<title>Ordination</title>
<style>
  body {
    background: #F6ECD0;
    text-align: center;
  }
  /* EXIT BUTTON */
  .exit-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #F5DFA8;
    border: none;
    padding: 12px 18px;
    border-radius: 40px;
    font-size: 18px;
    font-weight: bold;
    color: #4A1E1E;
    cursor: pointer;
    box-shadow: 0px 0px 8px rgba(0,0,0,0.2);
    transition: 0.2s;
    z-index: 1000;
  }

  .exit-btn:hover {
    background: #e9cd8c;
    transform: scale(1.05);
  }
  
  /* OUR WORKS */
  .subtitle {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-family: Orelega One;
    font-size: 70px;
    font-weight: 600;
    color: #4A1E1E;
    z-index: 20;
    pointer-events: none;
  }

  /* BIG CENTER TITLE */
  .title {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-family: Orelega One;
    font-size: 150px;
    font-weight: 900;
    color: #4A1E1E;
    z-index: 30;
    white-space: nowrap;
    pointer-events: none;
  }

  .marquee {
    width: 100%;
    overflow: hidden;
    position: absolute;
    display: flex;
    justify-content: center;
    margin-top: 300px;
    background-color: #F6DC9B;
  }

  .marquee-content {
    display: flex;
    animation: scroll 30s linear infinite;
  }

  .marquee-content img {
    width: 360px;
    margin-right: 70px;
    border-radius: 50px;
  }

  /* Keyframe for smooth infinite scroll */
  @keyframes scroll {
    from {
      transform: translateX(0);
    }
    to {
      transform: translateX(-25%);
    }
  }
  /* POPUP OVERLAY */
  .popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
  }

  /* POPUP BOX */
  .popup-box {
    background:transparent;
    width: 30%;
    height: 80%;
    border-radius: 20px;
    box-shadow:none;
    overflow: hidden;
    position: relative;
  }

  /* POPUP CONTENT (Booking.html iframe) */
  .popup-box iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  
</style>
</head>
<body>
<!-- EXIT BUTTON -->
<a href="services.html">

  <h2 class="subtitle">Our Works</h2>

<!-- BOOK NOW BUTTON (OPEN POPUP) -->
<button onclick="openPopup()"

</button>

<!-- POPUP OVERLAY -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopupOutside(event)">
  <div class="popup-box" onclick="event.stopPropagation()">
      <iframe src="Booking.html"></iframe>
  </div>
</div>

<script>
  function openPopup() {
      document.getElementById("popupOverlay").style.display = "flex";
  }

  function closePopupOutside(event) {
      document.getElementById("popupOverlay").style.display = "none";
  }
</script>
