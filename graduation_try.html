<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Gallery</title>
<style>
  body {
    margin: 0;
    background: #F6ECD0;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  h1 {
    margin-top: 50px;
    font-size: 80px;
    color: #4A1E1E;
  }

  h2 {
    font-size: 50px;
    color: #4A1E1E;
  }

  /* EXIT BUTTON */
  .exit-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #F5DFA8;
    border: none;
    padding: 12px 18px;
    border-radius: 40px;
    font-size: 18px;
    font-weight: bold;
    color: #4A1E1E;
    cursor: pointer;
    box-shadow: 0px 0px 8px rgba(0,0,0,0.2);
    transition: 0.2s;
    z-index: 1000;
  }
  .exit-btn:hover {
    background: #e9cd8c;
    transform: scale(1.05);
  }

  /* GALLERY GRID */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 15px;
    padding: 40px;
    justify-items: center;
  }

  .gallery img {
    width: 100%;
    max-width: 380px;
    border-radius: 20px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  }

  /* IMAGE POPUP */
  .image-popup {
    display: none;
    position: fixed;
    top:0; left:0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(5px);
    justify-content: center;
    align-items: center;
    z-index: 2000;
  }

  .image-popup img {
    width: auto;
    height: 90%;
    max-width: 90%;
    border-radius: 20px;
    box-shadow: 0 0 40px black;
  }

  /* BOOK NOW BUTTON */
  .book-btn {
    margin: 20px auto 50px;
    font-size: 22px;
    background:#F5DFA8;
    padding:14px 24px;
    border-radius:50px;
    border:none;
    cursor:pointer;
    font-weight:bold;
    transition: 0.2s;
  }
  .book-btn:hover {
    background:#e9cd8c;
  }

  /* POPUP OVERLAY */
  .popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 3000;
  }

  /* POPUP BOX */
  .popup-box {
    background: #fff4dd;
    width: 30%;
    height: 60%;
    border-radius: 20px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
    overflow: hidden;
    position: relative;
  }

  /* POPUP CONTENT (Booking.html iframe) */
  .popup-box iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<!-- EXIT BUTTON -->
<a href="services.html"><button class="exit-btn">← Exit</button></a>

<h2>Our Works</h2>
<h1>Graduation</h1>

<!-- GALLERY -->
<div class="gallery">
  <img src="grad1.png" onclick="openImagePopup(this.src)">
  <img src="grad2.png" onclick="openImagePopup(this.src)">
  <img src="grad3.png" onclick="openImagePopup(this.src)">
  <img src="grad4.png" onclick="openImagePopup(this.src)">
</div>

<!-- BOOK NOW BUTTON -->
<button class="book-btn" onclick="openPopup()">Book Now</button>

<!-- IMAGE POPUP -->
<div class="image-popup" id="imagePopup" onclick="closeImagePopup(event)">
  <img id="popupImage">
</div>

<!-- BOOKING POPUP -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopupOutside(event)">
  <div class="popup-box" onclick="event.stopPropagation()">
    <iframe src="Booking.html"></iframe>
  </div>
</div>

<script>
  // IMAGE POPUP
  function openImagePopup(src) {
    const popup = document.getElementById('imagePopup');
    const img = document.getElementById('popupImage');
    img.src = src;
    popup.style.display = 'flex';
  }

  function closeImagePopup(e) {
    if(e.target.id === 'imagePopup') {
      e.target.style.display = 'none';
    }
  }

  // BOOK NOW POPUP
  function openPopup() {
    document.getElementById("popupOverlay").style.display = "flex";
  }

  function closePopupOutside(event) {
    document.getElementById("popupOverlay").style.display = "none";
  }
</script>

</body>
</html>
